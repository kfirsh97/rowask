[theme]
base = "light"
primaryColor = "#2F5D4E"
backgroundColor = "#EDEEEA"
secondaryBackgroundColor = "#E2E4DE"
textColor = "#22282A"
font = "sans serif"

[server]
headless = true
maxUploadSize = 25        # MB per file: enough for real spreadsheets, not enough to tie up a free server

[browser]
gatherUsageStats = false
