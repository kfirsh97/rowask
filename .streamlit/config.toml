[theme]
base = "light"
primaryColor = "#2F5D4E"
backgroundColor = "#EDEEEA"
secondaryBackgroundColor = "#E2E4DE"
textColor = "#22282A"
font = "sans serif"

[server]
headless = true
maxUploadSize = 100       # MB per file. A big CSV takes several times its size in memory while it is cleaned

[browser]
gatherUsageStats = false
