# Superstore: order lines of an office-supplies, furniture and technology retailer in the US and Canada,
# 2023-2026, one row per product in an order.
# Build the database from the CSV first:   python setup/csv_to_sqlite.py data/superstore.csv

title = "Superstore Sales"
description = """Chat with the Superstore sales data in Hebrew or English: orders, customers, products, regions,
discounts and profit. The agent writes the SQL, checks its own result,
and shows the query behind every answer."""
business = "a retailer of office supplies, furniture and technology in the US and Canada"
database_url = "sqlite:///data/superstore.sqlite"

examples = [
    "מה הרווח לפי קטגוריה בכל שנה?",
    "Which 5 sub-categories lose the most money?",
    "איך ההנחה משפיעה על הרווח?",
    "מי עשרת הלקוחות הכי רווחיים?",
]

notes = """
- One table, superstore: ONE ROW PER PRODUCT IN AN ORDER (an order line). An order with 3 products has 3 rows.
  Count orders with COUNT(DISTINCT Order_ID), customers with COUNT(DISTINCT Customer_ID) - never COUNT(*).
- Sales: revenue of the line in US dollars, after discount. Profit: profit of the line in US dollars - often
  negative (a loss). Profit margin = SUM(Profit) / SUM(Sales).
- Discount: a fraction, 0 to 0.8 (0.2 = 20% off). Quantity: units of the product in the line.
- Order_Date / Ship_Date: 'YYYY-MM-DD' text. Data covers 2023-01-03 to 2026-12-30.
  Days to ship = julianday(Ship_Date) - julianday(Order_Date).
- Category: 'Office Supplies', 'Furniture', 'Technology'; Sub_Category: 17 values (e.g. 'Tables', 'Binders', 'Phones').
- Segment: 'Consumer', 'Corporate', 'Home Office'. Ship_Mode: 'Standard Class', 'Second Class', 'First Class', 'Same Day'.
- Country_Region: 'United States' or 'Canada' (200 rows). State_Province holds US states and Canadian provinces.
  Region: 'West', 'East', 'Central', 'South'.
- Product_ID is not unique to one product name (a few IDs carry 2 names) - group by Product_Name for product questions.
- Postal_Code is text; some US ZIP codes lost their leading zero in the source (4 digits instead of 5).
"""

# The metric dictionary (metrics.py): one agreed definition per business number.
[[metrics]]
name = "Revenue"
definition = "Sales after discount, in US dollars."
sql = "SUM(Sales)"
table = "superstore"
date = "Order_Date"
unit = "USD"
aliases = ["sales", "total sales", "הכנסות", "מכירות", "סך המכירות"]

[[metrics]]
name = "Orders"
definition = "Number of distinct orders - an order has one row per product, so never COUNT(*)."
sql = "COUNT(DISTINCT Order_ID)"
table = "superstore"
date = "Order_Date"
aliases = ["number of orders", "order count", "הזמנות", "מספר הזמנות"]

[[metrics]]
name = "Profit margin"
definition = "Total profit as a percentage of total sales - a ratio of sums, never an average of row margins."
sql = "100.0 * SUM(Profit) / SUM(Sales)"
table = "superstore"
date = "Order_Date"
unit = "%"
aliases = ["margin", "שולי רווח", "אחוז רווח"]

[[metrics]]
name = "Average order value"
definition = "Revenue divided by the number of distinct orders."
sql = "SUM(Sales) / COUNT(DISTINCT Order_ID)"
table = "superstore"
date = "Order_Date"
unit = "USD"
aliases = ["AOV", "ערך הזמנה ממוצע", "ממוצע להזמנה"]

[[metrics]]
name = "Active customers"
definition = "Customers (by Customer_ID) with an order dated after the day 90 days before the latest order date in the table (counted back from the data, not from today; the day exactly 90 days before is not included)."
sql = "COUNT(DISTINCT Customer_ID)"
table = "superstore"
filter = "Order_Date > date((SELECT MAX(Order_Date) FROM superstore), '-90 days')"
aliases = ["active clients", "לקוחות פעילים"]

[[metrics]]
name = "Late shipment rate"
definition = "Share of orders shipped more than 4 days after the order date, as a percentage of all orders."
sql = "100.0 * COUNT(DISTINCT CASE WHEN julianday(Ship_Date) - julianday(Order_Date) > 4 THEN Order_ID END) / COUNT(DISTINCT Order_ID)"
table = "superstore"
date = "Order_Date"
unit = "%"
aliases = ["late shipments", "late deliveries", "משלוחים מאוחרים", "שיעור איחורים"]
